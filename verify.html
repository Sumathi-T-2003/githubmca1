<!DOCTYPE html>
<html>
<head>
    <title>Verify Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="container py-5 text-center">
    <div class="card p-5 mx-auto" style="max-width: 500px;">
        <h3>Blockchain Verifier</h3>
        <p class="text-muted">Enter Invoice ID to verify on Public Ledger</p>
        <form action="/verify_logic" method="POST">
            <input type="text" name="inv_num" class="form-control mb-3" placeholder="Ex: INV-101" required>
            <button class="btn btn-success w-100">Verify Now</button>
        </form>
        
        {% if data %}
        <div class="mt-4 alert alert-success">
            <strong>✓ Verified on Blockchain</strong><br>
            Vendor: {{ data[1] }} <br>
            Amount: ₹{{ data[2] }}
        </div>
        {% elif error %}
        <div class="mt-4 alert alert-danger"><strong>✗ Alert:</strong> {{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
