<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockchain GST Ledger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding-top: 40px; font-family: 'Segoe UI', sans-serif; }
        .main-card { background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 30px; }
        .btn-primary { background: #0d6efd; border: none; font-weight: bold; }
        .gst-info { font-size: 0.9rem; color: #6c757d; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container" style="max-width: 600px;">
    <div class="main-card">
        <h2 class="text-center text-primary mb-4">🛡️ GST Blockchain System</h2>
        
        {% if result %}
        <div class="alert alert-info border-0 shadow-sm">{{ result }}</div>
        {% endif %}

        <form action="/add_invoice" method="POST" class="mb-5">
            <h5 class="mb-3 text-secondary">Add New Invoice</h5>
            
            <input type="text" name="inv_num" class="form-control mb-3" placeholder="Invoice ID (e.g. GST001)" required>
            <input type="text" name="vendor" class="form-control mb-3" placeholder="Vendor Name" required>
            
            <label class="form-label">Amount (Type or Click Arrow)</label>
            <div class="input-group mb-1">
                <input type="number" name="amount" id="amtInput" class="form-control" placeholder="Enter Amount" required>
                
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" onclick="setAmount(500)">₹500</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setAmount(1000)">₹1,000</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setAmount(2000)">₹2,000</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setAmount(5000)">₹5,000</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setAmount(10000)">₹10,000</a></li>
                </ul>
            </div>
            <p class="gst-info">* Automatic 18% GST will be calculated</p>

            <button type="submit" class="btn btn-primary w-100 mt-3 py-2">Store on Blockchain</button>
        </form>

        <hr>

        <form action="/verify_invoice" method="POST">
            <h5 class="mb-3 text-secondary">Verify Authenticity</h5>
            <div class="input-group">
                <input type="text" name="inv_num" class="form-control" placeholder="Search Invoice ID" required>
                <button type="submit" class="btn btn-dark px-4">Verify</button>
            </div>
        </form>
    </div>
</div>

<script>
    function setAmount(val) {
        document.getElementById('amtInput').value = val;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
